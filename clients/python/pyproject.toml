[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavlink2grpc-proto"
version = "0.0.1"
description = "Python gRPC stubs for MAVLink2gRPC"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "grpcio>=1.30.0",
    "protobuf>=4.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
